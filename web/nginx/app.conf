# Shared by the HTTP and HTTPS servers (default.conf, https.conf).
root /usr/share/nginx/html;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

# API calls go to the FastAPI container on the private Docker network. Looking "api" up through
# Docker's DNS on each request (rather than once at startup) keeps this working if the API
# container restarts with a new address, and lets the page load even while the API is down.
resolver 127.0.0.11 valid=10s ipv6=off;
set $api_upstream http://api:8000;

location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Hashed build files never change, so cache them hard.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# App manifest and service worker: always fetch fresh so updates arrive.
location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    add_header Cache-Control "no-cache";
}
location = /sw.js {
    add_header Cache-Control "no-cache";
}

# Everything else is the single-page app.
location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
}
