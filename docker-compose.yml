# Element Quest: run with  docker compose up -d --build
# Then open http://localhost:8080 (or http://<your-mac-name>.local:8080 from phones on the same Wi-Fi).

# A fixed project name, so the database volume keeps the same name (element-quest_db-data)
# whatever the folder is called.
name: element-quest

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-element}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-element_quest}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-element}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-element_quest}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      STUDENT_DEFAULT_PASSWORD: ${STUDENT_DEFAULT_PASSWORD:-elements}
      SEED_STUDENTS: ${SEED_STUDENTS:-soysauce:Soy Sauce,ketchupking:Ketchup King}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Denver}
      NEW_CARDS_PER_DAY: ${NEW_CARDS_PER_DAY:-20}
      MASTERY_DAYS: ${MASTERY_DAYS:-21}
      EASY_ANSWER_MS: ${EASY_ANSWER_MS:-4000}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"   # the only port reachable from your network
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
