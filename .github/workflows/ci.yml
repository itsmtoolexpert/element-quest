name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: element
          POSTGRES_PASSWORD: element
          POSTGRES_DB: eq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U element" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql+psycopg://element:element@localhost:5432/eq_test
      SECRET_KEY: ci-secret-key-that-is-long-enough-1234567890
      ADMIN_PASSWORD: ci-admin-pass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply cleanly
        run: alembic upgrade head && alembic downgrade base
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: |
          cp .env.example .env
          docker compose build
