# Used by docker-compose.https.yml. Serves the same app over HTTPS (port 443 in the container)
# with certificates made by scripts/https-setup.sh, and keeps plain HTTP working too.
server {
    listen 80;
    server_name _;
    include /etc/nginx/snippets/app.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/element-quest.pem;
    ssl_certificate_key /etc/nginx/certs/element-quest-key.pem;
    include /etc/nginx/snippets/app.conf;
}
